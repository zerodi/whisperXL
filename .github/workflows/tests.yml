name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Prepare sentence tokenizer
        run: uv run --locked --python ${{ matrix.python-version }} python -m nltk.downloader punkt_tab

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest tests/ -v
