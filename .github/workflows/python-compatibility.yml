name: Python Compatibility Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual triggering from GitHub UI

permissions: {}

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python-version }}

      - name: Check if lockfile is up to date
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Test import
        run: |
          uv run --locked --python ${{ matrix.python-version }} python -c "import whisperxl, whisperx.asr, whisperx.alignment, whisperx.diarize, torchcodec; print('Core imports OK')"

      - name: Check installed dependencies
        run: uv pip check

      - name: Check CLI
        run: uv run --locked --python ${{ matrix.python-version }} whisperxl --help

      - name: Check CLI version
        run: uv run --locked --python ${{ matrix.python-version }} whisperxl --version
