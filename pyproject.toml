[project]
urls = { repository = "https://github.com/zerodi/whisperxl" }
authors = [
    { name = "Max Bain" },
    { name = "Dmitriy Pyankov" },
]
name = "whisperxl"
version = "3.9.0rc0"
description = "Time-Accurate Automatic Speech Recognition using Whisper."
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = "BSD-2-Clause"
license-files = ["LICENSE"]

dependencies = [
    "omegaconf>=2.3.1,<2.4",
    "numpy>=2.5.3,<2.6",
    "pandas>=3.0.6,<3.1",
    "nltk>=3.10.3,<3.11",
    "transformers>=5.18.0,<5.19",
    "huggingface-hub>=1.33.0,<2",
    "torch>=2.11.0,<2.12",
    "torchaudio>=2.11.0,<2.12",
    "torchvision>=0.26.0,<0.27",
    "torchcodec>=0.17.0,<0.18",
    "pyannote-audio>=4.0.7,<4.1",
    "faster-whisper2>=2.1.3,<2.2",
    "ctranslate2>=4.8.2,<4.9",
]


[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
whisperxl = "whisperx.__main__:cli"
whisperx = "whisperx.__main__:cli"

[build-system]
requires = ["setuptools"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["whisperx*", "whisperxl*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'x86_64' and platform_machine != 'AMD64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "(platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
